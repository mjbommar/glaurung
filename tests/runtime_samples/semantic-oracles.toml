version = 1

# Evaluator-only expectations for the completed crash and memory categories
# plus the first normal/dangerous representatives. The harness joins these
# after execution; acquisition and future analyzers receive only the binary,
# scenario argument, and captured evidence.

[[case]]
id = "normal_open_file.good"
sample = "normal_open_file"
scenario = "good"
process_outcome = "exit:0"

[[case.assertion]]
kind = "os_event"
subject = "path:input.txt"
predicate = "open_result"
expected = "success"
independent_oracle = "kernel_result"

[[case.assertion]]
kind = "negative"
subject = "finding:dangerous_file_open"
predicate = "present"
expected = "false"
independent_oracle = "fixture_contract"

[[case]]
id = "normal_open_file.bad"
sample = "normal_open_file"
scenario = "bad"
process_outcome = "exit:0"

[[case.assertion]]
kind = "os_event"
subject = "path:missing-runtime-sample"
predicate = "open_result"
expected = "failure:ENOENT"
independent_oracle = "kernel_result"

[[case.assertion]]
kind = "negative"
subject = "finding:dangerous_file_open"
predicate = "present"
expected = "false"
independent_oracle = "fixture_contract"

