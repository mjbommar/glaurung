# Named, reproducible slices of the fixture corpus.
#
# The full matrix is every declared fixture x 4 lanes and takes minutes. That is the right
# cost for a gate and the wrong cost for iterating on one defect. These sets name
# the slices worth re-running constantly, so an iteration loop is
# `tools/dectest.py @loops` rather than a remembered selector string.
#
# Rules that keep this file honest:
#   * every set must resolve to at least one lane      (test_dectest_selection.py)
#   * every set must have a description                (same)
#   * @smoke must stay <= 6 lanes                      (same)
# A set that rots — naming a renamed fixture or a deleted function — fails the
# fast suite rather than silently shrinking someone's loop.
#
# Status counts live in the committed baseline rather than these descriptions;
# hard-coded prose counts go stale whenever the corpus or decompiler improves.

[smoke]
description = "Six passing canaries across four shape families, ~8s. Run this constantly."
# Deliberately FUNCTION-scoped, not lane-scoped. The lane-scoped version ran 43
# functions in 39 seconds, which is not a smoke test — it is a slow gate nobody
# runs twice. Every function here PASSES in the baseline, so any of them turning
# red is unambiguous; a set of known failures would tell you nothing.
selectors = [
    "01_conditional_polarity:gcc:O0:ternary",       # cmov / Op::Ite
    "01_conditional_polarity:gcc:O0:sc_and",        # short-circuit shared join
    "03_loop_shapes:gcc:O0:for_sum",                # the plainest loop there is
    "03_loop_shapes:gcc:O0:nested_carry",           # nested loops, carried value
    "11_call_shapes:gcc:O0:call_forward_result",    # a call result satisfies return
    "12_loop_rotation:clang:O0:factorial_while",    # clang's rotated loop form
]

[vector-float]
description = "Every fixture whose C actually reaches xmm/vector or scalar-float registers: the blast radius of any register-view or lane-spelling change."
# Assembled for the regview work (task #24), where a change to the x86-64 view
# table flipped `movd %eax,%xmm0` from a complete definition to an opaque one.
# That is fail-closed and right, but opacity PROPAGATES — it can suppress
# transforms in any function that touches a vector register, which is a much
# wider surface than the one or two fixtures that motivate such a change. The
# members are grepped, not guessed: each one's source names float, double, a
# vector type, or an intrinsic.
selectors = [
    "172_float_double_widths",
    "173_float_int_conversions",
    "174_float_compare_classify",
    "175_float_matrix_kernel",
    "181_compensated_summation",
    "188_vector_transport",
    "121_dense_expression",
    "09_memory_effects",
]

[region]
description = "The Phase 4 region-ownership set: loops, switches, rotation, and early exits."
selectors = [
    "03_loop_shapes",
    "04_switch_shapes",
    "12_loop_rotation",
    "13_loop_early_exit",
]

[switch]
description = "Switch and ladder recovery (04)."
selectors = ["04_switch_shapes"]

[loops]
description = "Every loop shape: plain (03), rotated (12), and early-exit (13)."
selectors = ["03_loop_shapes", "12_loop_rotation", "13_loop_early_exit"]

[early-exit]
description = "Break, continue, and early-return loops from fixture 13."
selectors = ["13_loop_early_exit"]

[flags]
description = "x86 flag producer/consumer effects (14). The Phase 3 acceptance set."
selectors = ["14_flag_effects"]

[calls]
description = "Calling conventions (06) and call shapes (11) — argument and result recovery."
selectors = ["06_calling_conventions", "11_call_shapes"]

[polarity]
description = "Conditional polarity (01). The regression canary for any predicate change."
selectors = ["01_conditional_polarity"]

[widths]
description = "Integer widths and sub-register views (02). The Phase 2 value-model canary."
selectors = ["02_integer_widths"]

[structs]
description = "Aggregates/memory (09) plus C++ runtime shapes (10)."
selectors = ["09_memory_effects", "10_cpp_runtime_shapes"]

[aggregates]
description = "Stack and pointer aggregates: layout, arrays, subscripts, bias, packing, and by-value transfer. The EPIC 3 object-recovery set."
# @structs is about memory *effects* surviving lowering; this set is about
# recovering the *object* — extent, stride, field offset, and index bias. The
# fixtures were reachable only by explicit name, which made the aggregate work
# the one workstream with no iteration loop of its own.
selectors = [
    "100_struct_layout",
    "108_multidimensional_arrays",
    "109_subscript_commutativity",
    "110_pointer_arithmetic",
    "111_self_referential_struct",
    "129_struct_by_value",
    "161_packed_struct_layout",
    "162_unaligned_memcpy_access",
    "187_constant_bias_index",
    # The by-value ABI transfer lane. `129_struct_by_value` keeps its
    # struct-taking functions `static` and deliberately never returns one, so
    # without this the set covered aggregate LAYOUT and no aggregate ABI
    # CONTRACT at all — the four System V return classes had no named loop.
    "195_by_value_aggregates",
]

[returns]
description = "Everything about the RESULT of a call: narrow and boolean widths (194), the SysV/AAPCS64 aggregate return classes (195, 197, 198) and pointer returns (199)."
# A census of all 900 function definitions in the corpus found that 704 of them
# return a 32-bit integer, and that the return SHAPE — sub-register width,
# boolean normalisation, register pair, hidden pointer, address — was the axis
# with the fewest lanes and no named loop of its own. `@aggregates` covers the
# object; this covers what comes back out of the call.
selectors = [
    "194_narrow_return_widths",
    "195_by_value_aggregates",
    "197_homogeneous_float_aggregates",
    "198_aggregate_return_edges",
    "199_pointer_return_kinds",
]

[bias]
description = "Constant-bias array indexing (187) — the shape the affine-index analysis targets, with its value-bias and runtime-bias controls."
selectors = ["187_*"]

[o0]
description = "Every fixture, unoptimised, both compilers. Where structuring bugs are legible."
selectors = ["*:gcc:O0", "*:clang:O0"]

[o2]
description = "Every fixture at -O2, both compilers. Where cmov, merged values and type loss live."
selectors = ["*:gcc:O2", "*:clang:O2"]

[clang-o0]
description = "Every Clang -O0 fixture, where unoptimised structuring bugs are most legible."
selectors = ["*:clang:O0"]

