# 183 covers the sentinel shapes the harness could build before it had a
# linked-structure argument kind, and `dormant-transforms-2026-08-12.md`
# measured every one of them at 0 fires. 192 is the isolated trigger — a
# parameter head advanced by a dependent load — so any future edit to the
# rotation matcher is measured against the input it was designed for.
