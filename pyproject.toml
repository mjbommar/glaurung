[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "glaurung"
requires-python = ">=3.12"
description = "A modern rewrite of Ghidra in Rust/Python with first-class agentic AI"
authors = [
    {name = "Michael Bommarito", email = "michael.bommarito@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    "structlog>=25.4.0",
    "pydantic>=2.11.7",
    "pydantic-ai-slim[anthropic,google,openai]>=1.86.0",
    "rich>=14.1.0",
    "pydantic-ai>=1.86.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.3",
]

[project.scripts]
glaurung = "glaurung.cli:main"
[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-benchmark",
]
[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module", "python-ext"]
include = [
    "python/glaurung/py.typed",
    "python/glaurung/*.pyi",
    # Stubs for the compiled extension itself, generated by
    # tools/gen_native_stub.py. Without this line the wheel ships a `.so`
    # that no type checker can read.
    "python/glaurung/_native/*.pyi",
]
module-name = "glaurung._native"

[dependency-groups]
dev = [
    # `[build-system].requires` provisions the PEP 517 backend, NOT a runnable
    # `maturin` command — assuming otherwise is what made the decompiler fixture
    # gate's matrix job fail with "Failed to spawn: maturin" on every commit.
    # Declaring and locking it here means `uv sync --dev` puts it on PATH.
    "maturin>=1.9,<2.0",
    "pyelftools>=0.33",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-benchmark>=5.1.0",
]

# NOTE: pytest configuration lives in pytest.ini (its presence makes pytest
# ignore [tool.pytest.ini_options] here). The `slow` marker is registered there.

# --- ruff -------------------------------------------------------------------
#
# CLAUDE.md names ruff as a required gate ("don't claim done without running
# tests + ruff + ty"). Until 2026-08-16 no ruff configuration existed anywhere in
# the repo, which made that gate BOTH unachievable and non-deterministic:
#
#   uvx ruff --version                 -> 0.16.3   (uvx resolves latest, always)
#   uvx ruff check python/             -> 3507 errors, 413 rules enabled
#   uvx ruff format --check python/    -> 305 files would be reformatted
#
# With no `select`, ruff applies its own evolving default set, so the gate's
# verdict could change on a ruff release with no commit here — the same class of
# defect as a `cargo test` that silently omits a feature. Pinning the rule set is
# what makes the command mean something.
#
# `select` is the classic minimal set: pyflakes plus the pycodestyle errors that
# indicate real defects. The `ignore` list below is DEBT, not policy — each entry
# records what the tree currently violates, measured, so the gate is green and
# honest today and the backlog is visible in the file that enforces it. Burn one
# down and delete its line.
[tool.ruff]
# MUST track `requires-python` above. They disagreed until 2026-08-18 --
# `py314` against a declared floor of 3.11 -- and ruff's formatter dutifully
# rewrote five `except (A, B):` into PEP 758's unparenthesized form, which is
# a SyntaxError on every interpreter the project claimed to support. A
# formatter told to target a version you do not require will happily emit code
# you cannot run.
target-version = "py312"
line-length = 88
extend-exclude = [
    # Generated verbatim from the built PyO3 extension by
    # tools/gen_native_stub.py, and compared byte-for-byte against a fresh
    # generation by python/tests/test_native_stub_current.py. Letting the
    # formatter rewrite it would make that test fail for cosmetic reasons.
    "python/glaurung/_native/",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # 64 occurrences. Frequently deliberate here: modules that must adjust
    # sys.path or probe for the native extension before importing it.
    "E402",
    # 62. Mostly re-exports in __init__.py and TYPE_CHECKING-shaped imports.
    "F401",
    # 8. Cosmetic.
    "F541",
    # 7, and the most interesting of the group. All are STRING annotations
    # naming a type the module never imports -- e.g. binary_diff.py annotates
    # `Optional[Dict[str, "FunctionStructure"]]` while that class lives in
    # structural_fingerprint.py and is not imported, not even under
    # TYPE_CHECKING. No runtime error, because the annotation is never
    # evaluated; but no type checker can resolve it either, so the annotation
    # asserts something nothing verifies. Worth fixing properly.
    "F821",
    # 4. Assigned-and-unused locals; each needs a look, since one may be a
    # dropped result rather than dead code.
    "F841",
    # 2 + 1 + 1 + 1. Cosmetic or single-site.
    "E741",
    "E701",
    "E702",
    "E722",
]
