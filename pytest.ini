[pytest]
testpaths = python/tests
# `-m "not decbench"` is the default DESELECTION, not a ban: it keeps the
# ordinary `pytest python/tests/` run away from the out-of-tree DecBench fork.
# An explicit `-m ...` on the command line replaces this expression, so the
# opt-in is simply `uv run pytest python/tests/ -m decbench`.
# `-ra` prints the short summary for every non-passing outcome, skips
# included: 176 files call `pytest.skip()` at runtime, so without it a run
# with 200 silent skips is visually identical to a clean one
# (`docs/development/test-estate/01-reachability.md` 1.6). No skip *budget* --
# a hard cap would be flaky across environments; visibility is the deliverable.
addopts = -q -ra -m "not decbench" --disable-plugin-autoload -p anyio.pytest_plugin -p pytest_asyncio.plugin -p pytest_benchmark.plugin
markers =
    slow: end-to-end decompiler fixture matrix / structural lane (compiles + executes the corpus)
    decbench: needs the out-of-tree DecBench checkout ($DECBENCH_DIR), its venv, or a Joern JVM. Deselected by default; run with `-m decbench`.
