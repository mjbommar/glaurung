[pytest]
testpaths = python/tests
# `-m "not decbench"` is the default DESELECTION, not a ban: it keeps the
# ordinary `pytest python/tests/` run away from the out-of-tree DecBench fork.
# An explicit `-m ...` on the command line replaces this expression, so the
# opt-in is simply `uv run pytest python/tests/ -m decbench`.
# `-ra` prints the short summary for every non-passing outcome, skips
# included: 176 files call `pytest.skip()` at runtime, so without it a run
# with 200 silent skips is visually identical to a clean one
# (`docs/development/test-estate/01-reachability.md` 1.6). No skip *budget* --
# a hard cap would be flaky across environments; visibility is the deliverable.
# `-p xdist` LOADS the parallel runner; it does not enable it. `-n auto` is
# opt-in per invocation, because a 24-core box and a 4-core CI runner want
# different worker counts and a single failing test is easier to read serially.
# Measured 2026-09-02 on 24 cores: `-m core` 11:19 serial -> 4:13 with
# `-n auto`, 2,367 passed either way. `--disable-plugin-autoload` means this
# line is the ONLY way xdist gets loaded at all.
addopts = -q -ra -m "not decbench" --disable-plugin-autoload -p anyio.pytest_plugin -p pytest_asyncio.plugin -p pytest_benchmark.plugin -p xdist
markers =
    slow: end-to-end decompiler fixture matrix / structural lane (compiles + executes the corpus)
    decbench: needs the out-of-tree DecBench checkout ($DECBENCH_DIR), its venv, or a Joern JVM. Deselected by default; run with `-m decbench`.
    core: needs nothing beyond the built extension. Runs on any machine; the per-push CI floor.
    fixtures: needs tests/decompiler_fixtures/build/ (gitignored, ~40 min to build). Applied from tests/test_facets.json.
    toolchain: invokes a compiler at test time (gcc/clang/arm-none-eabi-gcc/...). Applied from tests/test_facets.json.
    lfs: reads Git LFS sample binaries; a checkout without `lfs: true` sees pointer files. Applied from tests/test_facets.json.
    docker: needs the pinned fixture-toolchain image. Applied from tests/test_facets.json.
    llm: needs a live model endpoint and key. Applied from tests/test_facets.json.
