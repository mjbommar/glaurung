# Does the test suite pass?
#
# An embarrassing question for a workflow to be the first to ask, but it was:
# before this file, NO workflow in this repository ran `cargo test`, and none
# ran the general Python suite. The inventory in docs/test-inventory/ counted
# it -- 6 of 445 Python test files executed in CI, and the single occurrence of
# the string "cargo test" under .github/ was a comment in feature-build-gate.yml
# explaining that that lane is deliberately `cargo check` instead.
#
# The estate was inverted. decompiler-fixtures.yml runs an expensive slow
# matrix on every push, while the cheap suite that answers "is anything broken"
# ran only when a human typed the command. This is the cheap half.
#
# Two jobs, because they fail for different reasons and a reader should not
# have to guess which half went red.
#
# **Git LFS is not optional here.** 1,214 sample binaries (~663 MB) are LFS
# objects and `actions/checkout@v4` does NOT fetch them by default: without
# `lfs: true` every test that opens a real binary reads a 130-byte pointer file
# instead. That is not a subtle failure -- the first run of this workflow went
# red across analysis::elf_plt, analysis::gopclntab, analysis::java_class and
# every other module that touches the corpus, while the same commit was 2,944
# green locally. Found by watching the run rather than assuming it. No other
# workflow in this repository sets `lfs`, which is worth a look.
name: test suite

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run of the same ref: this is a
# correctness gate, not a historical record, and only the tip matters.
concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test --features python-ext
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--features python-ext` and not a bare `cargo test`, which does not
      # BUILD src/python_bindings/ at all -- on 2026-08-14 a signature change
      # there left five test call sites on the old arity and `cargo test` still
      # reported 2321 passed over code it never compiled. python_bindings/ir.rs
      # is the real pipeline entry point, so most passes are only reachable
      # through it.
      #
      # This does not cover src/symbolic/, src/exec/ or the solver backends;
      # those need more than a hosted runner has, and feature-build-gate.yml
      # type-checks them instead.
      # 21 tests across analysis/cfg.rs and ir/ compile a fixture at test
      # time. Until 2026-09-01 each returned SILENTLY when its compiler was
      # absent -- reporting `ok` having asserted nothing, indistinguishable
      # from a pass. Measured with a PATH shim: on a machine without these,
      # **33 test executions pass while asserting nothing**, and the total does
      # not move to say so.
      #
      # `GLAURUNG_REQUIRE_TOOLCHAINS=1` (below) turns every such skip into a
      # failure, so CI is the place that guarantees those tests actually ran.
      # That only works if the runner really has the compilers, hence this
      # step -- and it deliberately has NO `|| true`: a provisioning failure
      # must be loud here rather than resurfacing as two confusing test
      # failures later. `gcc-arm-none-eabi` is the bare-metal ARM package and
      # is unrelated to the `gcc-aarch64-linux-gnu` that the python job cannot
      # install (see its comment).
      - name: Install the fixture compilers the Rust tests demand
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Rust tests
        # REQUIRE_TOOLCHAINS makes a missing compiler fail instead of skip.
        env:
          GLAURUNG_REQUIRE_TOOLCHAINS: "1"
        run: cargo test --features python-ext

  # 195 tests live in `src/symbolic/` and NOTHING ran them until 2026-09-01.
  # `cargo test` does not enable the feature; `--features python-ext` does not
  # either (it pulls in `exec`, not `symbolic`); and
  # `scripts/feature-build-gate.sh` runs `cargo check --all-targets`, which
  # COMPILES test code without running it. They were type-checked forever and
  # executed never -- 21,459 product LOC that no gate could turn red.
  #
  # Nothing was stopping them. `symbolic = ["exec"]` is pure Rust (the solver
  # is pluggable behind a trait), and the first run passed 3,025 / 0 with 103
  # symbolic tests executing. It only needed wiring.
  #
  # The other 92 are behind `solver-axeyum`, `solver-bitwuzla` and `solver-z3`,
  # which link external SMT libraries. Those stay out of this lane deliberately
  # -- `feature-build-gate.sh` type-checks them, and running them needs
  # provisioning this job should not silently depend on.
  symbolic:
    name: cargo test --features symbolic
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Symbolic engine tests
        env:
          GLAURUNG_REQUIRE_TOOLCHAINS: "1"
        run: cargo test --features symbolic
      # The invariant `fuzz-nightly.yml` models: prove the lane did what it
      # claims. A run in which zero `symbolic::` tests executed is a wiring
      # failure that would otherwise look exactly like a pass.
      - name: Prove the symbolic tests actually ran
        run: |
          n=$(cargo test --features symbolic -- --list 2>/dev/null | grep -c '^symbolic::' || true)
          echo "symbolic tests listed: $n"
          if [ "$n" -lt 50 ]; then
            echo "::error::only $n symbolic tests are reachable; this lane exists because they were unreachable once already"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The Python suite is TIERED by what each test needs (tests/test_facets.json,
  # applied as markers by conftest.py). Two jobs, both required on every push
  # and PR -- tiering is how coverage silently degrades, and this repository
  # has the receipts, so nothing here is "nightly only".
  #
  #   python-core      -m core       needs nothing: no LFS fetch, no cross
  #                                  toolchain. 2,363 tests, ~11 min on a
  #                                  24-core box. The fast signal.
  #   python-extended  everything    lfs + toolchain + docker/llm self-skips.
  #                    else          The slow signal, with its own timeout, so
  #                                  a timeout there cannot mask core.
  #
  # `fixtures` and `decbench` are deselected from both: this runner never has
  # the built matrix (decompiler-fixtures.yml owns it and runs that facet), and
  # DecBench is opt-in by construction.
  # ---------------------------------------------------------------------------
  python-core:
    name: pytest -m core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # NO `lfs: true`. `core` is defined as needing no sample binaries, so
      # this job skips the ~663 MB LFS fetch entirely. If a core test ever
      # reads samples/, test_test_facets.py reclassifies it and it leaves this
      # job -- the facet, not the checkout, is what guarantees that.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Build the extension
        run: uv run maturin develop --release
      - name: Python tests (core)
        # -n auto: the suite is parallel-safe (measured: 2,367 passed under
        # 24 workers, 0 failures). On this 4-core runner expect ~3-4x.
        run: uv run pytest python/tests/ -m "core and not decbench" -n auto

  python-extended:
    name: pytest (lfs, toolchain)
    runs-on: ubuntu-latest
    # 90, not 60. Measured: the whole suite is 48 minutes on a 24-core
    # developer box; this job carries the LFS/toolchain half of it on a
    # 4-core runner plus ~5 minutes of setup. A timeout kill reads as a red
    # suite rather than as "the budget was wrong", which is the worst way for
    # this to fail. Re-measure from the job's own duration, not from a guess.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # 1,214 sample binaries are LFS objects; without this every `lfs`
          # test reads a 130-byte pointer file. See the rust job's note.
          lfs: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 32-bit multilib for the i386 lane. `gcc` is present on the runner so
      # `shutil.which` says the lane is available, and then `gcc -m32` fails at
      # link time with "cannot find crti.o" -- the lane ERRORS instead of
      # skipping. aarch64/armv7 cross compilers are deliberately NOT installed:
      # `gcc-aarch64-linux-gnu` depends on an uninstallable `gcc-13-*` and the
      # whole step exited 100. Those lanes skip visibly.
      #
      # `|| true` because a coverage lane must never fail the suite by not
      # installing; the tests probe with a real compile and skip if absent.
      - name: Install 32-bit multilib (for the i386 lane)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib libc6-dev-i386 || true
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Build the extension
        run: uv run maturin develop --release
      # `docker`, `llm` and `decbench` tests are NOT deselected: the first two
      # detect their own prerequisites and skip with a reason, which is the
      # honest signal for facilities this runner may or may not have. The
      # `-ra` in pytest.ini keeps those skips visible.
      - name: Python tests (extended)
        run: uv run pytest python/tests/ -m "not core and not fixtures and not decbench" -n auto

  lint:
    name: ruff and ty
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Formatting and lint need no built extension, so this job does not pay
      # for one. `ty` does -- it resolves the native module -- so it is checked
      # in the python job's environment instead of here.
      - name: ruff format --check
        run: uvx ruff format --check python/
      - name: ruff check
        run: uvx ruff check python/
