[package]
name = "glaurung"
version = "0.1.0"
edition = "2021"
# The floor `docs/development/setup.md` and the CI toolchain image assert.
# Declaring it here is what makes cargo enforce it instead of failing
# somewhere deep in a dependency on an older toolchain.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "glaurung"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.26.0", optional = true }
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
uuid = { version = "1.0", features = ["v4", "v5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
bincode = "2.0.1"
md5 = "0.7"
chrono = { version = "0.4", features = ["serde"] }
bitflags = "2.0"
infer = "0.19.0"
mime_guess = "2.0.5"
object = "0.37.3"
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
pdb = "0.8"
aho-corasick = "1.1.3"
encoding_rs = "0.8.35"
memchr = "2.7"
regex = "1.10"
once_cell = "1.19"
strsim = "0.11"
goblin = { version = "0.10.1", optional = true, default-features = true }
pelite = { version = "0.10", optional = true }
iced-x86 = "1.20"
capstone = "0.12"
glaurung-disasm = { path = "crates/glaurung-disasm" }
# BinaryFuse8 membership gate over known function identities (item 7 of
# docs/history/program-measures-2026-09-02.md). Default features are
# NON-DETERMINISTIC: `uniform-random` fills unused filter slots with entropy
# from `rand`'s thread RNG, so two builds over identical keys produce
# different bytes (measured in the survey, docs/history/
# program-measures-2026-09-02/03-signature-schemas-and-indexes.md). Disabling
# defaults and taking only `binary-fuse` + `serde` removes that RNG dependency
# entirely and is byte-identical at unchanged FPR.
xorf = { version = "0.13.0", default-features = false, features = ["binary-fuse", "serde"] }

# Native in-process SMT solver (feature `solver-z3`); links libz3. Optional.
z3 = { version = "0.12", optional = true }
# The raw libz3 bindings the `z3` crate links, for the shadow-split capture's
# z3-parses-it check (`Z3_solver_from_string` + `Z3_get_error_msg`); the crate
# hides its context pointer and swallows parse errors (solver-037).
z3-sys = { version = "0.8", optional = true }
# Pure-Rust in-process SMT solver (feature `solver-axeyum`); no C dependency.
# The exact git revision keeps recall builds independent of a machine-local
# sibling checkout while preserving the minimal QF_BV consumer profile.
axeyum-solver = { git = "https://github.com/mjbommar/axeyum.git", rev = "43f1e0f9038de389d7b1a88b9d3b507ed3c6255d", optional = true, default-features = false, features = ["qfbv"] }
axeyum-ir = { git = "https://github.com/mjbommar/axeyum.git", rev = "43f1e0f9038de389d7b1a88b9d3b507ed3c6255d", optional = true }
# The C source-analysis stack (tolerant lexer/parser, CFG, dataflow, metrics,
# graph export, and the DecBench parity projection). Extracted from this tree
# at `0892552` (cindergraph's EXTRACTION.md) and now consumed as a crate:
# nothing under `src/` may carry a second copy. Unconditional because the
# consumers are (the `source_metrics` / `source_cfg` bindings, `src/metrics`,
# and the C-to-LLIR lowering in `src/csource/lower`). Pure Rust, one transitive
# dependency (`regex`), MSRV 1.88. Pinned to the GitHub head rather than a
# machine-local sibling checkout for the same reason the axeyum pins are; see
# docs/decisions/source-001-depend-on-cindergraph-by-git-rev.md.
cindergraph = { git = "https://github.com/mjbommar/cindergraph.git", rev = "8bd20512158d19d4cf632caba4bbed629271a3e5" }

# DEV-ONLY differential-test oracle (feature `dev-oracle`); links the system
# Unicorn engine via pkg-config (libunicorn-dev). Never shipped in the wheel.
unicorn-engine = { version = "2.1.5", optional = true, features = ["dynamic_linkage"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime for timeouts
tokio = { version = "1", features = ["rt", "time", "macros"] }
whatlang = "0.16.4"
unicode-script = "0.5"
memmap2 = "0.9.4"
bytes = "1.6.1"
blake3 = "1.5.1"
cpp_demangle = "0.4"
rustc-demangle = "0.1"
msvc-demangler = "0.10"
rayon = "1.10"
windows-metadata = "0.60"
# APK/AAB/JAR member extraction (ZIP central directory + DEFLATE). Already
# present transitively; declared directly for the `formats::apk` reader.
flate2 = "1.0"
mimalloc = { version = "0.1.52", default-features = false }
# --- the `gsig/1` signature container (src/flirt/gsig) ---------------------
# Record encoding. Varint everywhere and deliberately no schema-evolution
# story of its own: the versioning lives in the container's header and chunk
# table, not in the encoding. MIT OR Apache-2.0, 1.1.3 released 2025-07-24.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Zstandard, pure Rust, and since 0.9 it compresses as well as decompresses.
# This is the SHIPPED reader and the default writer: a wheel that can read a
# signature library must not need a C toolchain to do it. MIT, 0.9.0 released
# 2026-07-26.
ruzstd = "0.9.0"
# Zstandard via the reference C library (`zstd-sys` vendors zstd 1.5.7).
# BUILDER ONLY, behind `gsig-zstd`: ruzstd's encoder is materially weaker than
# the reference implementation at level 19, so a corpus publisher wants this
# and a reader never does. It adds a codec, it never changes the writer's
# DEFAULT codec, so a `.gsig` golden hash is identical with and without the
# feature. MIT, 0.13.3 released 2025-02-20.
zstd = { version = "0.13.3", optional = true }

[features]
default = ["triage-core", "solver-axeyum"]
triage-core = []
triage-heuristics = []
triage-containers = []
triage-parsers-extra = ["goblin", "pelite"]
# Compile the WP4 observer beside the production structurer. It records typed
# shadow evidence only; v1 remains the sole source of rendered output.
structure-v2-shadow = []
# The Python extension bundles the pure-Rust emulator directly. Ordinary builds
# also receive symbolic execution and authoritative Axeyum through the default
# `solver-axeyum` feature; `--no-default-features` is the explicit exclusion.
python-ext = ["pyo3", "pyo3/extension-module", "exec"]
# Native execution engine (concrete emulator). Pure Rust, no new C dependency —
# see docs/history/execution-engine-2026-06/. Off by default; opt in with --features exec.
exec = []
# Symbolic / concolic execution over the same engine. Builds a bitvector
# expression IR (pure Rust). The solver is pluggable behind a trait.
symbolic = ["exec"]
# DEV-ONLY: validate the emulator against the Unicorn engine (links system
# libunicorn). Never shipped. Use: cargo test --features dev-oracle.
dev-oracle = ["exec", "dep:unicorn-engine"]
# Comparison-only native SMT backend via the `z3` crate. Enabling it also
# enables Axeyum; Z3 must never become the authoritative result.
solver-z3 = ["solver-axeyum", "dep:z3", "dep:z3-sys"]
# Native, in-process, pure-Rust SMT backend via the `axeyum` solver. No C
# dependency and wheel-shippable. This is the default and sole authoritative
# SAT/SMT backend. Z3 and Bitwuzla are comparison cells only.
solver-axeyum = ["symbolic", "dep:axeyum-solver", "dep:axeyum-ir"]
# Benchmark-only native Bitwuzla 0.9.1 cell. This direct C-API adapter is
# intentionally not part of production backend selection; it exists only for
# topology-equivalent cold/warm neutral measurements.
solver-bitwuzla = ["symbolic"]
# Legacy/reference SMT-LIB text bridge. This deliberately opts into axeyum's
# full profile; production solver-axeyum remains on the minimal QF_BV surface.
solver-axeyum-text = ["solver-axeyum", "axeyum-solver/full"]
# Explicit oracle/comparison-only subprocess topology. Production and ordinary
# tests do not compile process spawning or PATH-based solver selection.
solver-pipe-oracle = ["symbolic"]
# BUILDER-ONLY `.gsig` codec: the reference C zstd encoder at level 19, as an
# additional `Codec` value. The pure-Rust reader decodes those frames without
# the feature, and the writer's default codec is unchanged, so enabling this
# never moves a golden hash. See docs/reference/function-signature-libraries.md.
gsig-zstd = ["dep:zstd"]

[dev-dependencies]
tempfile = "3.21.0"
criterion = { version = "0.7.0", features = ["html_reports"], default-features = false }

[[bench]]
name = "triage"
harness = false

[[bench]]
name = "entropy"
harness = false

[[bench]]
name = "strings"
harness = false

[[bench]]
name = "lang_detect"
harness = false

[[bench]]
name = "emulator"
harness = false
required-features = ["exec"]

[[bench]]
name = "ir_lift"
harness = false

[[bench]]
name = "ir_dataflow"
harness = false

[[bench]]
name = "ir_structure"
harness = false

[[bench]]
name = "analysis_cfg"
harness = false

[[bench]]
name = "decompile_pipeline"
harness = false

[[bench]]
name = "source_parse"
harness = false

[[bench]]
name = "disasm_decode"
harness = false

# Examples that drive the symbolic engine only build with its feature enabled,
# so `cargo build --all-targets` under default features skips them cleanly.
[[example]]
name = "ioctl_scan"
required-features = ["symbolic"]

[[example]]
name = "ordered_native_replay"
required-features = ["solver-axeyum"]

[[example]]
name = "ioctlance"
required-features = ["symbolic"]

[[example]]
name = "linux_symbolic_cve"
required-features = ["solver-axeyum"]

[[example]]
name = "axeyum_diff"
required-features = ["solver-z3", "solver-axeyum"]

[[example]]
name = "axeyum_bench_primitives"
required-features = ["solver-z3", "solver-axeyum"]

[[example]]
name = "axeyum_sweep"
required-features = ["solver-z3", "solver-axeyum"]

[[example]]
name = "axeyum_incremental"
required-features = ["solver-z3", "solver-axeyum"]

[[example]]
name = "axeyum_infeasible_path_proof"
required-features = ["solver-axeyum"]
